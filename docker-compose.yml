services:
  backend:
    build: ./backend
    container_name: grandstay-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    expose:
      - "5000"

  frontend:
    build: ./frontend
    container_name: grandstay-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
